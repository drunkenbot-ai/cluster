[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drunkenbot-cluster"
version = "0.1.0"
description = "Lightweight port-blocked distributed LLM training via centralized storage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DrunkenBot AI Team"}
]
dependencies = [
    "torch>=2.0.0",
]

[project.scripts]
cluster = "cluster.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cluster*"]
